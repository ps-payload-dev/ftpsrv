<!doctype html>
<html>
  <head>
    <!-- dont request favicon -->
    <link rel="icon" href="data:,">
    <!-- https://cdn.jsdelivr.net/npm/xterm@5.0.0/css/xterm.min.css -->
    <link rel="stylesheet" href="xterm.css">
    <!-- cdn.jsdelivr.net/npm/xterm@5.0.0/lib/xterm.min.js -->
    <script src="xterm.js"></script>
  </head>
  <body id="terminal" bgcolor="black">
    <script>
      async function render_stdout(response) {
	  try {
	      const reader = response.body.getReader();
	      const decoder = new TextDecoder();

	      while (true) {
		  const { done, value } = await reader.read();
		  if (done) {
		      break;
		  }
		  let decodedValue = decoder.decode(value);
		  term.write(decodedValue);
	      }
	  } catch (error) {
	  }
      }

      async function deploy(path) {
	  const params = new URLSearchParams({
	      elf: 'file://' + path,
	      pipe: "1"
	  });
	  let response = undefined;

	  try {
	      response = await fetch('/elfldr?' + params);
	  } catch (error) {
	  }

	  if(!response || !response.ok) {
	      const loader = new URLSearchParams({
		  uri: 'file:' + path + '?args='
	      });

	      try {
		  response = await fetch('http://127.0.0.1:9021/?' + loader);
	      } catch (error) {
		  return false;
	      }
	      if(!response.ok) {
		  return false;
	      }
	  }

	  render_stdout(response);
	  return true;
      }

      const term = new Terminal({
	  convertEol: true,
	  altClickMovesCursor: false,
	  disableStdin: true,
	  fontSize: 18,
	  cols: 90,
	  rows: 25
      });
      term.open(document.getElementById('terminal'));

      //const uri = 'https://github.com/ps5-payload-dev/ftpsrv/releases/latest/download/ftpsrv-ps5.elf';
      deploy('/user/app/BREW10001/payload.elf');
    </script>
  </body>
</html>
